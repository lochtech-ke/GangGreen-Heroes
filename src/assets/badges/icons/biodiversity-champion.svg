<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Biodiversity Champion Achievement</title>
  <desc>Multiple species silhouettes in harmony representing biodiversity achievements</desc>
  
  <!-- Central circle (unity) -->
  <circle cx="60" cy="60" r="35" fill="none" stroke="white" stroke-width="3" opacity="0.4"/>
  
  <!-- Tree silhouette (top) -->
  <g transform="translate(60, 30)">
    <rect x="-2" y="0" width="4" height="12" fill="white"/>
    <circle cx="0" cy="-3" r="6" fill="white"/>
    <circle cx="-5" cy="0" r="4" fill="white"/>
    <circle cx="5" cy="0" r="4" fill="white"/>
  </g>
  
  <!-- Bird silhouette (top right) -->
  <g transform="translate(85, 45)">
    <path d="M -8 0 Q -4 -3 0 0 Q 4 -3 8 0" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="2" fill="white"/>
  </g>
  
  <!-- Fish silhouette (right) -->
  <g transform="translate(88, 60)">
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="white"/>
    <path d="M 8 0 L 12 -3 L 12 3 Z" fill="white"/>
    <circle cx="-3" cy="-1" r="1" fill="#333"/>
  </g>
  
  <!-- Butterfly silhouette (bottom right) -->
  <g transform="translate(82, 82)">
    <ellipse cx="-2" cy="-2" rx="4" ry="5" fill="white" transform="rotate(-20)"/>
    <ellipse cx="2" cy="-2" rx="4" ry="5" fill="white" transform="rotate(20)"/>
    <ellipse cx="-2" cy="2" rx="3" ry="4" fill="white" transform="rotate(-20)"/>
    <ellipse cx="2" cy="2" rx="3" ry="4" fill="white" transform="rotate(20)"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Flower silhouette (bottom) -->
  <g transform="translate(60, 92)">
    <circle cx="0" cy="-2" r="2" fill="white"/>
    <circle cx="-3" cy="-4" r="2" fill="white"/>
    <circle cx="3" cy="-4" r="2" fill="white"/>
    <circle cx="-4" cy="-1" r="2" fill="white"/>
    <circle cx="4" cy="-1" r="2" fill="white"/>
    <rect x="-1" y="-2" width="2" height="8" fill="white"/>
  </g>
  
  <!-- Leaf silhouette (bottom left) -->
  <g transform="translate(38, 82)">
    <path d="M 0 0 Q -5 -5 -6 -10 Q -5 -5 0 0 Q 5 -5 6 -10 Q 5 -5 0 0" 
          fill="white"/>
  </g>
  
  <!-- Paw print silhouette (left) -->
  <g transform="translate(32, 60)">
    <ellipse cx="0" cy="2" rx="3" ry="4" fill="white"/>
    <circle cx="-3" cy="-2" r="2" fill="white"/>
    <circle cx="0" cy="-3" r="2" fill="white"/>
    <circle cx="3" cy="-2" r="2" fill="white"/>
  </g>
  
  <!-- Bee silhouette (top left) -->
  <g transform="translate(35, 45)">
    <ellipse cx="0" cy="0" rx="5" ry="3" fill="white"/>
    <line x1="-2" y1="0" x2="-2" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="1" y1="0" x2="1" y2="0" stroke="#333" stroke-width="2"/>
    <path d="M -5 -1 L -8 -3 M -5 1 L -8 3" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Shadow effect -->
  <ellipse cx="60" cy="98" rx="30" ry="3" fill="white" opacity="0.2"/>
</svg>
