<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Tree Planter Achievement</title>
  <desc>Stylized tree with roots and branches representing tree planting achievements</desc>
  
  <!-- Tree trunk -->
  <rect x="56" y="60" width="8" height="35" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Roots -->
  <path d="M 60 95 Q 50 100 45 105" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 60 95 Q 70 100 75 105" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 60 95 L 60 105" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tree canopy - layered circles for depth -->
  <circle cx="60" cy="45" r="22" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="48" cy="50" r="16" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="72" cy="50" r="16" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Leaves detail -->
  <path d="M 60 30 L 60 25" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 38 L 46 35" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M 70 38 L 74 35" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Shadow effect -->
  <ellipse cx="60" cy="107" rx="18" ry="3" fill="white" opacity="0.2"/>
</svg>
