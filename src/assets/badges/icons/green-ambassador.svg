<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Green Ambassador Achievement</title>
  <desc>Megaphone with leaf symbol representing environmental advocacy</desc>
  
  <!-- Megaphone body -->
  <g transform="translate(45, 60)">
    <!-- Main cone -->
    <path d="M 0 -15 L 25 -25 L 25 25 L 0 15 Z" 
          fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner detail -->
    <path d="M 5 -12 L 22 -20 L 22 20 L 5 12" 
          fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    
    <!-- Handle -->
    <path d="M 0 15 Q -8 18 -8 25 Q -8 28 -5 28 L 0 28" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Mouthpiece -->
    <ellipse cx="0" cy="0" rx="3" ry="15" fill="none" stroke="white" stroke-width="3"/>
    
    <!-- Sound waves -->
    <path d="M 30 -20 Q 35 -15 35 0 Q 35 15 30 20" 
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 38 -15 Q 42 -10 42 0 Q 42 10 38 15" 
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Leaf symbol (message being broadcast) -->
  <g transform="translate(80, 45)">
    <!-- Leaf shape -->
    <path d="M 0 0 Q -6 -10 -7 -16 Q -6 -10 0 0 Q 6 -10 7 -16 Q 6 -10 0 0" 
          fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Leaf vein -->
    <line x1="0" y1="0" x2="0" y2="-16" stroke="white" stroke-width="2" opacity="0.6"/>
    
    <!-- Side veins -->
    <path d="M 0 -6 L -3 -9" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 -6 L 3 -9" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 -11 L -4 -13" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 -11 L 4 -13" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Additional leaf (top right) -->
  <g transform="translate(85, 30)">
    <path d="M 0 0 Q -4 -6 -5 -10 Q -4 -6 0 0 Q 4 -6 5 -10 Q 4 -6 0 0" 
          fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="white" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Additional leaf (bottom right) -->
  <g transform="translate(82, 65)">
    <path d="M 0 0 Q -4 -6 -5 -10 Q -4 -6 0 0 Q 4 -6 5 -10 Q 4 -6 0 0" 
          fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="white" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Message sparkle -->
  <g transform="translate(75, 55)">
    <line x1="-3" y1="0" x2="3" y2="0" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Shadow effect -->
  <ellipse cx="60" cy="95" rx="30" ry="3" fill="white" opacity="0.2"/>
</svg>
