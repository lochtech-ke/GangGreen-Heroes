<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Water Guardian Achievement</title>
  <desc>Water drop with protective hands representing water conservation achievements</desc>
  
  <!-- Water drop -->
  <path d="M 60 20 Q 75 40 75 55 Q 75 70 60 80 Q 45 70 45 55 Q 45 40 60 20 Z" 
        fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner water detail (ripple) -->
  <path d="M 60 30 Q 68 42 68 52 Q 68 62 60 70 Q 52 62 52 52 Q 52 42 60 30 Z" 
        fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  
  <!-- Water shine -->
  <circle cx="56" cy="45" r="3" fill="white" opacity="0.7"/>
  <circle cx="62" cy="50" r="2" fill="white" opacity="0.5"/>
  
  <!-- Left hand (cupped) -->
  <path d="M 35 70 Q 30 75 32 82 L 38 88 Q 42 90 45 87 L 48 82" 
        fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left hand fingers -->
  <path d="M 35 70 L 33 65" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 38 69 L 37 64" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 41 69 L 41 64" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right hand (cupped) -->
  <path d="M 85 70 Q 90 75 88 82 L 82 88 Q 78 90 75 87 L 72 82" 
        fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right hand fingers -->
  <path d="M 85 70 L 87 65" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 82 69 L 83 64" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 79 69 L 79 64" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Shadow effect -->
  <ellipse cx="60" cy="92" rx="25" ry="3" fill="white" opacity="0.2"/>
</svg>
