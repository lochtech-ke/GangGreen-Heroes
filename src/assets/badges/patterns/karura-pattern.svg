<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <title>Karura Forest Pattern</title>
  <desc>Urban forest pattern with mixed trees and city elements</desc>
  
  <!-- Background gradient -->
  <defs>
    <linearGradient id="karuraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7C59" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8B7355" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#87CEEB" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Tree silhouette pattern -->
    <pattern id="karuraTrees" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Deciduous tree -->
      <rect x="20" y="60" width="4" height="20" fill="#8B7355" opacity="0.3"/>
      <circle cx="22" cy="55" r="12" fill="#4A7C59" opacity="0.35"/>
      <circle cx="18" cy="58" r="8" fill="#4A7C59" opacity="0.3"/>
      <circle cx="26" cy="58" r="8" fill="#4A7C59" opacity="0.3"/>
      
      <!-- Conifer tree -->
      <rect x="70" y="55" width="3" height="25" fill="#8B7355" opacity="0.3"/>
      <path d="M 71.5 30 L 60 55 L 83 55 Z" fill="#4A7C59" opacity="0.35"/>
      <path d="M 71.5 40 L 63 60 L 80 60 Z" fill="#4A7C59" opacity="0.3"/>
    </pattern>
    
    <!-- Geometric nature border pattern -->
    <pattern id="karuraGeometric" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="15" height="15" fill="none" stroke="#4A7C59" stroke-width="1.5" opacity="0.3"/>
      <circle cx="47.5" cy="17.5" r="7.5" fill="none" stroke="#8B7355" stroke-width="1.5" opacity="0.3"/>
      <path d="M 17.5 40 L 25 50 L 10 50 Z" fill="none" stroke="#4A7C59" stroke-width="1.5" opacity="0.3"/>
      <line x1="40" y1="40" x2="55" y2="55" stroke="#87CEEB" stroke-width="1.5" opacity="0.25"/>
      <line x1="55" y1="40" x2="40" y2="55" stroke="#87CEEB" stroke-width="1.5" opacity="0.25"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="400" height="400" fill="url(#karuraBg)"/>
  
  <!-- Tree pattern -->
  <rect width="400" height="400" fill="url(#karuraTrees)"/>
  
  <!-- City skyline silhouette (subtle, in background) -->
  <g opacity="0.15">
    <rect x="50" y="320" width="30" height="80" fill="#8B7355"/>
    <rect x="90" y="300" width="25" height="100" fill="#8B7355"/>
    <rect x="125" y="330" width="35" height="70" fill="#8B7355"/>
    <rect x="170" y="310" width="28" height="90" fill="#8B7355"/>
    <rect x="210" y="325" width="32" height="75" fill="#8B7355"/>
    <rect x="250" y="305" width="30" height="95" fill="#8B7355"/>
    <rect x="290" y="315" width="26" height="85" fill="#8B7355"/>
    <rect x="325" y="335" width="30" height="65" fill="#8B7355"/>
    
    <!-- Building windows -->
    <g fill="#87CEEB" opacity="0.5">
      <rect x="55" y="330" width="4" height="4"/>
      <rect x="62" y="330" width="4" height="4"/>
      <rect x="69" y="330" width="4" height="4"/>
      <rect x="95" y="310" width="4" height="4"/>
      <rect x="102" y="310" width="4" height="4"/>
      <rect x="175" y="320" width="4" height="4"/>
      <rect x="182" y="320" width="4" height="4"/>
    </g>
  </g>
  
  <!-- Mixed tree silhouettes (foreground) -->
  <g opacity="0.3">
    <!-- Large tree left -->
    <rect x="40" y="200" width="8" height="50" fill="#8B7355"/>
    <ellipse cx="44" cy="190" rx="35" ry="30" fill="#4A7C59"/>
    <ellipse cx="30" cy="200" rx="20" ry="18" fill="#4A7C59" opacity="0.8"/>
    <ellipse cx="58" cy="200" rx="20" ry="18" fill="#4A7C59" opacity="0.8"/>
    
    <!-- Medium tree right -->
    <rect x="330" y="220" width="6" height="40" fill="#8B7355"/>
    <circle cx="333" cy="210" r="25" fill="#4A7C59"/>
    <circle cx="320" cy="218" r="15" fill="#4A7C59" opacity="0.8"/>
    <circle cx="346" cy="218" r="15" fill="#4A7C59" opacity="0.8"/>
    
    <!-- Small tree cluster center -->
    <rect x="190" y="240" width="4" height="30" fill="#8B7355"/>
    <circle cx="192" cy="235" r="15" fill="#4A7C59"/>
    <rect x="210" y="245" width="4" height="25" fill="#8B7355"/>
    <circle cx="212" cy="240" r="12" fill="#4A7C59"/>
  </g>
  
  <!-- Birds (decorative elements) -->
  <g opacity="0.25">
    <path d="M 150 100 Q 145 97 140 100 Q 145 97 150 100" 
          fill="none" stroke="#4A7C59" stroke-width="2" stroke-linecap="round"/>
    <circle cx="145" cy="102" r="2" fill="#4A7C59"/>
    
    <path d="M 280 140 Q 275 137 270 140 Q 275 137 280 140" 
          fill="none" stroke="#8B7355" stroke-width="2" stroke-linecap="round"/>
    <circle cx="275" cy="142" r="2" fill="#8B7355"/>
    
    <path d="M 200 80 Q 195 77 190 80 Q 195 77 200 80" 
          fill="none" stroke="#4A7C59" stroke-width="2" stroke-linecap="round"/>
    <circle cx="195" cy="82" r="2" fill="#4A7C59"/>
  </g>
  
  <!-- Pathways (subtle lines) -->
  <g opacity="0.2">
    <path d="M 0 350 Q 100 345 200 350 Q 300 355 400 350" 
          fill="none" stroke="#8B7355" stroke-width="3"/>
    <path d="M 150 300 Q 180 280 200 300" 
          fill="none" stroke="#8B7355" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Sky elements (clouds) -->
  <g opacity="0.15">
    <ellipse cx="100" cy="60" rx="30" ry="12" fill="#87CEEB"/>
    <ellipse cx="85" cy="65" rx="20" ry="10" fill="#87CEEB"/>
    <ellipse cx="115" cy="65" rx="20" ry="10" fill="#87CEEB"/>
    
    <ellipse cx="300" cy="90" rx="35" ry="14" fill="#87CEEB"/>
    <ellipse cx="280" cy="95" rx="22" ry="11" fill="#87CEEB"/>
    <ellipse cx="320" cy="95" rx="22" ry="11" fill="#87CEEB"/>
  </g>
</svg>
