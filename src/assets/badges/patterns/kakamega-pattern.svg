<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <title>Kakamega Forest Pattern</title>
  <desc>Tropical rainforest canopy pattern with deep greens</desc>
  
  <!-- Background gradient -->
  <defs>
    <linearGradient id="kakamegaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2D5F4F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4A7C59" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Leaf pattern -->
    <pattern id="kakamegaLeaves" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Large tropical leaf -->
      <path d="M 20 10 Q 15 20 10 40 Q 15 30 20 10 Q 25 30 30 40 Q 25 20 20 10" 
            fill="#2D5F4F" opacity="0.4"/>
      <line x1="20" y1="10" x2="20" y2="40" stroke="#1B4D3E" stroke-width="1" opacity="0.3"/>
      
      <!-- Medium leaf -->
      <path d="M 60 30 Q 56 36 52 48 Q 56 40 60 30 Q 64 40 68 48 Q 64 36 60 30" 
            fill="#4A7C59" opacity="0.35"/>
      
      <!-- Small leaf -->
      <path d="M 40 60 Q 37 64 34 72 Q 37 67 40 60 Q 43 67 46 72 Q 43 64 40 60" 
            fill="#2D5F4F" opacity="0.3"/>
    </pattern>
    
    <!-- Vine border pattern -->
    <pattern id="kakamegaVine" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 15 20 20 Q 30 25 40 20" 
            fill="none" stroke="#1B4D3E" stroke-width="2" opacity="0.4"/>
      <circle cx="10" cy="18" r="3" fill="#2D5F4F" opacity="0.3"/>
      <circle cx="30" cy="22" r="3" fill="#2D5F4F" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="400" height="400" fill="url(#kakamegaBg)"/>
  
  <!-- Leaf canopy pattern -->
  <rect width="400" height="400" fill="url(#kakamegaLeaves)"/>
  
  <!-- Decorative tropical leaves (larger, scattered) -->
  <g opacity="0.25">
    <!-- Top left large leaf -->
    <path d="M 60 40 Q 45 60 40 100 Q 50 70 60 40 Q 70 70 80 100 Q 75 60 60 40" 
          fill="#1B4D3E"/>
    <line x1="60" y1="40" x2="60" y2="100" stroke="#0D3A2E" stroke-width="2"/>
    
    <!-- Top right leaf cluster -->
    <path d="M 340 60 Q 330 75 325 100 Q 332 82 340 60 Q 348 82 355 100 Q 350 75 340 60" 
          fill="#2D5F4F"/>
    <path d="M 360 80 Q 352 92 348 110 Q 354 96 360 80 Q 366 96 372 110 Q 368 92 360 80" 
          fill="#4A7C59"/>
    
    <!-- Bottom left foliage -->
    <ellipse cx="80" cy="340" rx="40" ry="25" fill="#2D5F4F"/>
    <ellipse cx="60" cy="350" rx="30" ry="20" fill="#1B4D3E"/>
    <ellipse cx="100" cy="355" rx="35" ry="22" fill="#4A7C59"/>
    
    <!-- Bottom right palm fronds -->
    <path d="M 320 320 L 300 340 M 320 320 L 310 345 M 320 320 L 320 345 M 320 320 L 330 345 M 320 320 L 340 340" 
          stroke="#2D5F4F" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Butterflies (decorative elements) -->
  <g opacity="0.2">
    <g transform="translate(280, 150)">
      <ellipse cx="-3" cy="-2" rx="5" ry="6" fill="#4A7C59" transform="rotate(-20)"/>
      <ellipse cx="3" cy="-2" rx="5" ry="6" fill="#4A7C59" transform="rotate(20)"/>
      <ellipse cx="-3" cy="2" rx="4" ry="5" fill="#2D5F4F" transform="rotate(-20)"/>
      <ellipse cx="3" cy="2" rx="4" ry="5" fill="#2D5F4F" transform="rotate(20)"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#1B4D3E" stroke-width="1.5"/>
    </g>
    
    <g transform="translate(120, 280)">
      <ellipse cx="-3" cy="-2" rx="4" ry="5" fill="#2D5F4F" transform="rotate(-15)"/>
      <ellipse cx="3" cy="-2" rx="4" ry="5" fill="#2D5F4F" transform="rotate(15)"/>
      <ellipse cx="-3" cy="2" rx="3" ry="4" fill="#1B4D3E" transform="rotate(-15)"/>
      <ellipse cx="3" cy="2" rx="3" ry="4" fill="#1B4D3E" transform="rotate(15)"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#0D3A2E" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Rainfall effect (subtle lines) -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="95" y2="50" stroke="#4A7C59" stroke-width="1"/>
    <line x1="180" y1="0" x2="175" y2="60" stroke="#2D5F4F" stroke-width="1"/>
    <line x1="260" y1="0" x2="255" y2="45" stroke="#4A7C59" stroke-width="1"/>
    <line x1="140" y1="100" x2="135" y2="150" stroke="#2D5F4F" stroke-width="1"/>
    <line x1="300" y1="120" x2="295" y2="170" stroke="#4A7C59" stroke-width="1"/>
  </g>
</svg>
